name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_name: ${{ steps.vars.outputs.release_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Variables
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag_name=v1.0" >> $GITHUB_OUTPUT
            echo "release_name=BrowserPicker v1.0" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=BrowserPicker v1.0 (Dev build #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Validate notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Testing Apple notarization credentials (notarytool history)..."
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            2>&1 | tail -10
          echo "Credentials OK - proceeding to build."

      - name: Build Application Bundle
        run: |
          rm -rf BrowserPicker.app
          mkdir -p BrowserPicker.app/Contents/MacOS
          mkdir -p BrowserPicker.app/Contents/Resources
          if [ -f "AppIcon.icns" ]; then
            cp AppIcon.icns BrowserPicker.app/Contents/Resources/
          fi
          xcrun -sdk macosx swiftc main.swift -target x86_64-apple-macos11.0 -o BrowserPicker-x86_64
          xcrun -sdk macosx swiftc main.swift -target arm64-apple-macos11.0 -o BrowserPicker-arm64
          lipo -create BrowserPicker-x86_64 BrowserPicker-arm64 -output BrowserPicker.app/Contents/MacOS/BrowserPicker
          rm BrowserPicker-x86_64 BrowserPicker-arm64
          echo -n "APPL????" > BrowserPicker.app/Contents/PkgInfo
          cp Info.plist.example BrowserPicker.app/Contents/Info.plist

      - name: Setup macOS Signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "password" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "password" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          rm certificate.p12

      - name: Sign, Notarize, and Staple Application
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime --timestamp --deep --sign "$APPLE_SIGNING_IDENTITY" BrowserPicker.app
          /usr/bin/ditto -c -k --keepParent BrowserPicker.app BrowserPicker.zip
          xcrun notarytool submit BrowserPicker.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple BrowserPicker.app
          /usr/bin/ditto -c -k --keepParent BrowserPicker.app BrowserPicker-Notarized.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPicker-Notarized
          path: BrowserPicker-Notarized.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: BrowserPicker-Notarized

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.release_name }}
          body: |
            ${{ github.ref == 'refs/heads/main' && 'Stable release' || 'Development build - may be unstable.' }}
            Branch: `${{ github.ref_name }}` | Run: #${{ github.run_number }} | Commit: ${{ github.sha }}
          files: BrowserPicker-Notarized.zip
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
