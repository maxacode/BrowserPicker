name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Testing Apple notarization credentials (notarytool history)..."
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            2>&1 | tail -10
          echo "Credentials OK - proceeding to build."

      - name: Build Application Bundle
        run: |
          mkdir -p BrowserPicker.app/Contents/MacOS
          mkdir -p BrowserPicker.app/Contents/Resources
          if [ -f "AppIcon.icns" ]; then
            cp AppIcon.icns BrowserPicker.app/Contents/Resources/
          fi
          xcrun -sdk macosx swiftc main.swift -o BrowserPicker.app/Contents/MacOS/BrowserPicker
          echo -n "APPL????" > BrowserPicker.app/Contents/PkgInfo
          cp Info.plist.example BrowserPicker.app/Contents/Info.plist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPicker
          path: BrowserPicker.app
